name: Fieldbook checks
on: [push, pull_request]
jobs:
  validate:
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONTZPATH: ""
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            python: '3.10'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: npm install --ignore-scripts --no-save
        working-directory: fieldbook_core
      - run: git diff --exit-code -- fieldbook_core/package.json
      - run: python -m pip install -r fieldbook_core/requirements.txt
      - run: python -m pip install -r fieldbook_core/requirements-intake.txt
      - run: node --test tests/*.test.mjs
      - run: python tools/manage-vault.py health
      - run: node tools/validate.mjs .
      - run: python -B tools/release-acceptance.py
      - run: python -B tools/usage-acceptance.py
      - run: python -B -m unittest discover -s tests -p '*_test.py'
